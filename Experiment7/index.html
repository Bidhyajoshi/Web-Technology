<!DOCTYPE html>
<html>
<head>
    <title>Student & Product Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>📊 Management Dashboard</h1>

    <!-- STUDENT SECTION -->
    <div class="card">
        <h2>🎓 Student Section</h2>

        <select id="studentSelect">
            <option value="">Choose Option</option>
            <option value="all">All Students</option>
            <option value="top">Topper</option>
            <option value="90">Above 90</option>
            <option value="cse">CSE Only</option>
        </select>

        <input type="text" id="searchBox" placeholder="Search name...">

        <button id="studentBtn">Process</button>

        <div id="studentResult"></div>
    </div>

    <!-- PRODUCT SECTION -->
    <div class="card">
        <h2>🛒 Product Section</h2>

        <select id="productSelect">
            <option value="">Choose Category</option>
            <option value="all">All Products</option>
            <option value="electronics">Electronics</option>
            <option value="furniture">Furniture</option>
            <option value="groceries">Groceries</option>
            <option value="total">Total Price</option>
        </select>

        <button id="productBtn">Show</button>

        <div id="productResult"></div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
